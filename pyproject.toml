[project]
name = "mcp-server-ai-search"
version = "0.1.0"
description = "MCP Server with Azure AI Search Agentic Retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.13.3",
    "debugpy>=1.8.0",
    "mcp>=1.3.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    # Azure SDKs
    "azure-identity>=1.19.0",
    "azure-search-documents>=11.7.0b2",  # Preview for agentic retrieval
    "azure-storage-blob>=12.23.0",
    "openai>=1.50.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
lint.select = ["E", "F", "I", "UP"]
